# Local test environment for sqit: one MySQL server with two databases.
#
#   sqit_local     – the LOCAL database (working tree), user sqit_local_user (read/write)
#   sqit_upstream  – plays the TEST/UPSTREAM role,      user sqit_upstream_user (SELECT only)
#
# The SQL files in ./testdata run once, on first start, in alphabetical order.
# Reset to the seed state with:  docker compose down -v && docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: sqit-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: sqit-root
    ports:
      - "${SQIT_MYSQL_PORT:-3306}:3306"
    volumes:
      - ./testdata:/docker-entrypoint-initdb.d:ro
      - sqit-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psqit-root"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  sqit-mysql-data:
